name: Publish (manual fallback)

# Superseded by .github/workflows/release.yml, which publishes automatically
# via Changesets when the "Version Packages" PR is merged. This workflow is
# kept as a manual escape hatch (e.g. to republish a tag if the automated
# release run fails) and no longer runs on tag push to avoid double-publishing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v0.7.0)'
        required: true

jobs:
  publish:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20.17.0'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm (Trusted Publishing needs npm 11.5.1+)
        run: npm install -g npm@11

      - name: Install huggingface_hub
        run: pip3 install --user --break-system-packages huggingface_hub || pip3 install --user huggingface_hub

      - run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ inputs.tag }}" ]; then
            echo "Tag ${{ inputs.tag }} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public --provenance
