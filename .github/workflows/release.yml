name: Release

# Standard Changesets flow, all in one workflow:
# - On every push to master, changesets/action either opens/updates the
#   "Version Packages" PR (if changesets are pending), or publishes to npm
#   and creates a GitHub Release (once that PR has been merged and
#   package.json's version isn't on npm yet).
#
# Publishing uses NPM_TOKEN (classic/automation auth) rather than OIDC
# Trusted Publishing. Two OIDC-based designs were tried and both failed:
#   1. changesets/action running npm publish directly from this workflow
#      404'd, because npm's Trusted Publisher config for @veloxquant/sdk is
#      registered against publish.yml specifically, not release.yml.
#   2. Delegating the actual publish to publish.yml (first via
#      workflow_call, then via a tag push from release.yml) still failed:
#      a workflow_call run doesn't match npm's OIDC claim check even with
#      an identical filename, and a tag pushed using the default
#      GITHUB_TOKEN doesn't trigger other workflows at all (GitHub's
#      anti-recursion protection on Actions-authored pushes).
#
# IMPORTANT: changesets/action's publish step reads the token from an env
# var literally named NPM_TOKEN (see changesets/action's src/index.ts,
# `if (process.env.NPM_TOKEN)`) to decide whether to write an npm
# _authToken and skip OIDC. It does NOT read NODE_AUTH_TOKEN. Naming this
# env var anything else (e.g. NODE_AUTH_TOKEN) makes the action silently
# fall back to OIDC trusted publishing and fail (EOTP/E404), even though
# a perfectly valid token is sitting in the NPM_TOKEN secret.
on:
  push:
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install huggingface_hub
        run: pip3 install --user --break-system-packages huggingface_hub || pip3 install --user huggingface_hub

      - run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Create Version PR or publish
        uses: changesets/action@v1
        with:
          version: npm run changeset:version
          publish: npm run changeset:publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
