name: Release

# Handles only the "open/update the Version Packages PR" half of the
# Changesets flow, plus tagging. The actual `npm publish` runs in
# publish.yml, triggered by the `vX.Y.Z` tag this workflow pushes below —
# npm's OIDC Trusted Publisher config for @veloxquant/sdk is registered
# against publish.yml's own tag-push trigger specifically. A workflow_call
# chain into publish.yml was tried first and failed OIDC validation (E404
# on publish) even with a matching filename, so tagging-and-letting-the-
# push-trigger-fire is the reliable path.
on:
  push:
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version-or-detect-release:
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write

    outputs:
      has-changesets: ${{ steps.check.outputs.has-changesets }}
      unpublished-version: ${{ steps.check.outputs.unpublished-version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install huggingface_hub
        run: pip3 install --user --break-system-packages huggingface_hub || pip3 install --user huggingface_hub

      - run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Check for pending changesets and unpublished version
        id: check
        run: |
          PENDING="$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md')"
          if [ -n "$PENDING" ]; then
            echo "has-changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changesets=false" >> "$GITHUB_OUTPUT"
          fi

          LOCAL_VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED_VERSION="$(npm view @veloxquant/sdk version 2>/dev/null || echo '')"
          if [ "$LOCAL_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "unpublished-version=true" >> "$GITHUB_OUTPUT"
          else
            echo "unpublished-version=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update Version Packages PR
        if: steps.check.outputs.has-changesets == 'true'
        uses: changesets/action@v1
        with:
          version: npm run changeset:version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tag-release:
    needs: version-or-detect-release
    if: |
      needs.version-or-detect-release.outputs.has-changesets == 'false' &&
      needs.version-or-detect-release.outputs.unpublished-version == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Tag the release
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
